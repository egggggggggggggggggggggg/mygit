[package]
name = "back"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
axum = {version = "0.8.9", features = ["macros", "multipart"]}
dotenvy = "0.15.7"
gix = "0.83.0"
jsonwebtoken = "10.3.0"
serde = {version="1.0.228", features=["derive"]}
serde_json = "1.0.149"
sqlx = {version="0.8.6",  features = [ "runtime-tokio", "tls-rustls-aws-lc-rs", "_sqlite" ]}
time = "0.3.47"
tokio = {version = "1.52.0", features = ["full"]}
tower = "0.5.3"
uuid = {version = "1.23.1", features = ["v4"]}
