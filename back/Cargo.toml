[package]
name = "back"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
argon2 = "0.5.3"
axum = {version = "0.8.9", features = ["macros", "multipart",]}
base64 = "0.22.1"
dotenvy = "0.15.7"
gix = {version = "0.83.0"}
hex = "0.4.3"
jsonwebtoken = "10.3.0"
moka = {version = "0.12.15", features= ["future"]}
rand = "0.10.1"
rand_core = "0.10.1"
serde = {version="1.0.228", features=["derive"]}
serde_json = "1.0.149"
sha2 = "0.11.0"
sqlx = {version="0.8.6",  features = [ "uuid", "time", "runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "json" ]}
time = "0.3.47"
tokio = {version = "1.52.0", features = ["full"]}
tower = {version = "0.5.3", features = ["limit"]}
tower-http = {version = "0.6.8", features = ["cors"]}
uuid = {version = "1.23.1", features = ["v4", "serde" ]}
