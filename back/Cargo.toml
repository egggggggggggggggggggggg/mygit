[package]
name = "back"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
argon2 = "0.5.3"
axum = {version = "0.8.9", features = ["macros", "multipart",]}
base64 = "0.22.1"
dotenvy = "0.15.7"
futures = "0.3.32"
gix = {version = "0.83.0", features = ["serde"]}
hex = "0.4.3"
infer = "0.19.0"
jsonwebtoken = {version = "10.3.0", features = ["aws_lc_rs"] }
moka = {version = "0.12.15", features= ["future"]}
rand_core = "0.10.1"
reqwest = {version = "0.13.3", features = ["multipart", "stream"]}
serde = {version="1.0.228", features=["derive"]}
serde_json = "1.0.149"
sha2 = "0.11.0"
sqlx = {version="0.8.6",  features = [ "uuid", "time", "runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "json" ]}
thiserror = "2.0.18"
time = {version = "0.3.47", features = ["serde"]}
tokio = {version = "1.52.0", features = ["full"]}
tokio-util = "0.7.18"
tower = {version = "0.5.3", features = ["limit"]}
tower-http = {version = "0.6.8", features = ["cors"]}
tracing = "0.1.44"
utoipa = {version = "5.5.0", features = ["uuid", "time", "axum_extras" ]}
utoipa-axum = "0.2.0"
utoipa-swagger-ui = {version = "9.0.2", features = ["axum"]}
uuid = {version = "1.23.1", features = ["v7", "serde" ]}
